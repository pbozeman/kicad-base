# Forgejo Actions CI
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - native
          - macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: pre-commit
        run: |
          nix develop -c pre-commit run --all-files --show-diff-on-failure
